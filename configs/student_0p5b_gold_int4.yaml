# Quantization sweep — the fine-tuned 0.5B gold student in 4-bit (NF4, in-flight).
# The 0.5B is the least-redundant model, so it's the sharpest test of whether the
# INT4 "free lunch" holds as models shrink.
config_name: student_0p5b_gold_int4
engine: vllm
model_path: tanishq0421/slimserve-student_0p5b_gold   # placeholder; serve the AWQ dir via --model
precision: int4
quantization: awq          # served from an AWQ checkpoint (scripts/quantize.py)
kv_cache_quant: false
max_num_seqs: 256
tensor_parallel_size: 1
gpu_memory_utilization: 0.90
max_model_len: 8192
params_b: 0.5
gpu_hourly_usd: 0.20
evaluator: toolcall
eval_samples: 200
