[project]
name = "slimserve"
version = "0.1.0"
description = "Compress a large tool-calling LLM into a fast, cheap SLM — and prove the cost delta."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    # Phase deps are added as you reach them, to keep the base install light:
    # Phase 1: "vllm", "autoawq"
    # Phase 3: "transformers", "peft", "trl", "bitsandbytes", "unsloth", "datasets"
]

[project.optional-dependencies]
serve = ["vllm", "autoawq"]
eval = ["datasets"]
viz = ["matplotlib", "pandas"]
train = ["unsloth", "transformers", "peft", "trl", "bitsandbytes", "datasets"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slimserve*"]
