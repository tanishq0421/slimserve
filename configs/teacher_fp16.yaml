# Phase 1, Week 1 — the FP16 baseline row.
config_name: teacher_fp16
engine: vllm
model_path: Qwen/Qwen2.5-7B-Instruct
precision: fp16
kv_cache_quant: false
max_num_seqs: 256
tensor_parallel_size: 2       # span both Kaggle T4s; FP16 7B OOMs on a single T4
gpu_memory_utilization: 0.85  # leave headroom on 16GB T4s (default 0.92 OOMs at warmup)
max_model_len: 8192           # our tool-calling prompts are short; caps KV-cache reservation
params_b: 7.0
gpu_hourly_usd: 0.40          # reference price; state your source in the README
