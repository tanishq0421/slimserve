# Quantization sweep — the fine-tuned 1.5B gold student served in 4-bit AWQ (the
# same method Phase 1 used on the teacher). Question: does INT4 stay "free" for a
# small fine-tuned model the way it did for the 7B, or does a less-redundant small
# model lose accuracy? Quantize first with scripts/quantize.py, serve via --model.
config_name: student_1p5b_gold_int4
engine: vllm
model_path: tanishq0421/slimserve-student_1p5b_gold   # placeholder; serve the AWQ dir via --model
precision: int4
quantization: awq          # served from an AWQ checkpoint (scripts/quantize.py)
kv_cache_quant: false
max_num_seqs: 256
tensor_parallel_size: 1
gpu_memory_utilization: 0.90
max_model_len: 8192
params_b: 1.5
gpu_hourly_usd: 0.20
evaluator: toolcall
eval_samples: 200
