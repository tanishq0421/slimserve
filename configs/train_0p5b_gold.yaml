# Phase 3 — QLoRA SFT of the 0.5B student on GOLD labels.
trainer: qlora
base_model: Qwen/Qwen2.5-0.5B-Instruct
dataset: data/sft_gold.jsonl
output_dir: checkpoints/student_0p5b_gold
lora_r: 16
lora_alpha: 32
epochs: 1
lr: 2.0e-4
load_in_4bit: false         # 0.5B fits in fp16 on a T4 — skip bitsandbytes entirely
max_seq_len: 2048
batch_size: 2               # fp16 logits over the 152k vocab are the memory hog
grad_accum: 8               # effective batch 16
