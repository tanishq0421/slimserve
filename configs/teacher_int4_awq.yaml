# Phase 1, Week 2 — INT4 (AWQ) row. Fits a SINGLE T4 comfortably (~4-5GB weights).
config_name: teacher_int4_awq
engine: vllm
model_path: Qwen/Qwen2.5-7B-Instruct-AWQ
precision: int4
quantization: awq               # vLLM auto-picks the kernel (Marlin ran fine on the T4)
kv_cache_quant: false
max_num_seqs: 256
tensor_parallel_size: 1         # one T4 is plenty for INT4 weights
gpu_memory_utilization: 0.90
max_model_len: 8192
params_b: 7.0
gpu_hourly_usd: 0.20            # ONE T4 = half the 2xT4 baseline price -> fair $/1M comparison
