# Phase 3 — QLoRA sequence DISTILLATION of the 0.5B student (train on teacher outputs).
# The 0.5B has the biggest quality gap, so it's the most interesting distillation target.
trainer: qlora
base_model: Qwen/Qwen2.5-0.5B-Instruct
dataset: data/teacher_distill.jsonl
output_dir: checkpoints/student_0p5b_distill
lora_r: 16
lora_alpha: 32
epochs: 1
lr: 2.0e-4
load_in_4bit: false         # 0.5B fits in fp16 on a T4 — skip bitsandbytes entirely
max_seq_len: 2048
batch_size: 4               # keep batch modest for T4 memory
grad_accum: 4               # effective batch 16
