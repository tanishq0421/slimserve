# Phase 3 — QLoRA SFT of the 0.5B student on GOLD labels.
trainer: qlora
base_model: Qwen/Qwen2.5-0.5B-Instruct
dataset: data/sft_gold.jsonl
output_dir: checkpoints/student_0p5b_gold
lora_r: 16
lora_alpha: 32
epochs: 1
lr: 2.0e-4
load_in_4bit: true
max_seq_len: 2048
batch_size: 16              # 0.5B is tiny — bigger batch fits fine
grad_accum: 1
