# Phase 3 — QLoRA sequence DISTILLATION of the 1.5B student (train on teacher outputs).
# Same recipe as gold, only the dataset differs -> that's what makes it distillation.
trainer: qlora
base_model: Qwen/Qwen2.5-1.5B-Instruct
dataset: data/teacher_distill.jsonl
output_dir: checkpoints/student_1p5b_distill
lora_r: 16
lora_alpha: 32
epochs: 1
lr: 2.0e-4
load_in_4bit: true
max_seq_len: 2048
batch_size: 2          # small per-step batch to fit a 16GB T4...
grad_accum: 8          # ...but effective batch stays 16
